<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard e Inventario de Cómputo</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Estilos del Formulario */
        .panel-form {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            height: fit-content;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn-submit {
            width: 100%;
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:disabled {
            background-color: #888;
        }

        /* Estilos de la Galería / Dashboard */
        .panel-inventory {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .inventory-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .card {
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            overflow: hidden;
            background: #fafafa;
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            font-size: 12px;
        }

        .card-body {
            padding: 12px;
        }

        .card-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 4px;
            color: #1a1a1a;
        }

        .card-subtitle {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }

        .badge-Operativo {
            background-color: #d4edda;
            color: #fffff;
        }

        .badge-Baja {
            background-color: red;
            color: #fffff;
        }

        .badge-Obsoleto {
            background-color: #ffd900;
            color: #fffff;
        }

        .badge-Asignado {
            background-color: #85e617;
            color: #fffff;
        }

        .card-detail {
            font-size: 12px;
            color: #444;
            margin-top: 6px;
        }
    </style>
</head>

<body>

    <div class="dashboard-layout">
        <!-- Panel Izquierdo: Formulario -->
        <div class="panel-form">
            <h3>Registrar Nuevo Equipo</h3>
            <form id="equipmentForm">
                <div class="form-group">
                    <label>ID Equipo / Activo</label>
                    <input type="text" id="id_equipo" required placeholder="Ej. EQ-2026-01">
                </div>
                <div class="form-group">
                    <label>Tipo de Equipo</label>
                    <select id="tipo_equipo" required>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Servidor">Servidor</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Marca y Modelo</label>
                    <input type="text" id="marca_modelo" required placeholder="Ej. Dell XPS 13">
                </div>
                <div class="form-group">
                    <label>Número de Serie</label>
                    <input type="text" id="numero_serie" required placeholder="Ej. SN-98765">
                </div>
                <div class="form-group">
                    <label>Estado</label>
                    <select id="estado" required>
                        <option value="Operativo">Operativo</option>
                        <option value="Asignado">Asignado</option>
                        <option value="Baja">Baja</option>
                        <option value="Obsoleto">Obsoleto</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Responsable</label>
                    <input type="text" id="responsable" placeholder="Ej. Carlos Mendoza">
                </div>
                <div class="form-group">
                    <label>Ubicación</label>
                    <input type="text" id="ubicacion" placeholder="Ej. Almacén Central">
                </div>
                <div class="form-group">
                    <label>Fotografía del Equipo</label>
                    <input type="file" id="foto" accept="image/*">
                </div>
                <button type="submit" class="btn-submit" id="btnSubmit">Guardar Equipo</button>
            </form>
        </div>

        <!-- Panel Derecho: Galería e Inventario -->
        <div class="panel-inventory">
            <div class="inventory-header">
                <h3>Inventario Registrado (<span id="totalCount">0</span>)</h3>
                <button onclick="loadInventory()" style="padding: 6px 12px; cursor: pointer;">🔄 Actualizar</button>
            </div>
            <div class="cards-grid" id="inventoryGrid">
                <p>Cargando datos del inventario...</p>
            </div>
        </div>
    </div>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAXufQXcf8Bp75suzkec2a7NfsSJOkoaSKg-LJJZ6cwnPCnxVRUrLH1GxyEMtMDZ09XQ/exec";

        document.addEventListener("DOMContentLoaded", loadInventory);

        function loadInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = "<p>Cargando datos...</p>";

            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('totalCount').textContent = data.length;
                    grid.innerHTML = "";

                    if (!data || data.length === 0) {
                        grid.innerHTML = "<p>No hay equipos registrados aún.</p>";
                        return;
                    }

                    data.reverse().forEach(item => {
                        const badgeClass = getBadgeClass(item.estado);
                        const imageHtml = (item.foto_url && item.foto_url.startsWith('http'))
                            ? `<img class="card-img" src="${item.foto_url}" alt="${item.marca_modelo}" loading="lazy">`
                            : `<div class="card-img">Sin fotografía</div>`;

                        grid.innerHTML += `
            <div class="card">
              ${imageHtml}
              <div class="card-body">
                <div class="card-title">${item.id_equipo}</div>
                <div class="card-subtitle">${item.marca_modelo}</div>
                <span class="badge ${badgeClass}">${item.estado}</span>
                <div class="card-detail"><strong>S/N:</strong> ${item.numero_serie}</div>
                <div class="card-detail"><strong>Resp:</strong> ${item.responsable || 'N/A'}</div>
                <div class="card-detail"><strong>Ubicación:</strong> ${item.ubicacion || 'N/A'}</div>
              </div>
            </div>
          `;
                    });
                })
                .catch(err => {
                    console.error("Error al cargar:", err);
                    grid.innerHTML = "<p>Error al cargar el inventario. Revisa la consola (F12).</p>";
                });
        }

        function getBadgeClass(estado) {
            switch (estado) {
                case 'Operativo': return 'badge-Operativo';
                case 'Baja': return 'badge-Baja';
                case 'Obsoleto': return 'badge-Obsoleto';
                case 'Asignado': return 'badge-Asignado';
                default: return '';
            }
        }

        document.getElementById('equipmentForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.textContent = "Guardando...";

            const fileInput = document.getElementById('foto');
            const file = fileInput.files[0];

            if (file) {
                // Redimensionar imagen para asegurar que el envio sea ligero
                const reader = new FileReader();
                reader.onload = function (event) {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const scaleFactor = MAX_WIDTH / img.width;

                        if (scaleFactor < 1) {
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleFactor;
                        } else {
                            canvas.width = img.width;
                            canvas.height = img.height;
                        }

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        const resizedBase64 = canvas.toDataURL('image/jpeg', 0.7); // Compresión al 70%

                        sendData(resizedBase64, file.name);
                    };
                };
                reader.readAsDataURL(file);
            } else {
                sendData("", "");
            }
        });

        function sendData(fotoBase64, fotoNombre) {
            const payload = {
                id_equipo: document.getElementById('id_equipo').value,
                tipo_equipo: document.getElementById('tipo_equipo').value,
                marca_modelo: document.getElementById('marca_modelo').value,
                numero_serie: document.getElementById('numero_serie').value,
                estado: document.getElementById('estado').value,
                responsable: document.getElementById('responsable').value,
                ubicacion: document.getElementById('ubicacion').value,
                foto_base64: fotoBase64,
                foto_nombre: fotoNombre
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
                .then(res => res.json())
                .then(res => {
                    if (res.status === "success") {
                        document.getElementById('equipmentForm').reset();
                        alert("¡Equipo guardado con éxito!");
                        loadInventory();
                    } else {
                        alert("Error reportado por el servidor: " + res.message);
                    }
                })
                .catch(err => {
                    console.error("Error al enviar:", err);
                    // Fallback: Si el navegador bloquea la lectura del JSON de respuesta por CORS, reintentamos recargar la lista
                    setTimeout(() => {
                        document.getElementById('equipmentForm').reset();
                        loadInventory();
                    }, 1500);
                })
                .finally(() => {
                    const btnSubmit = document.getElementById('btnSubmit');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = "Guardar Equipo";
                });
        }
    </script>
</body>

</html>
